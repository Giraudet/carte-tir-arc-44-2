
name: Mise à jour des concours

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - name: Enregistrer les changements
        run: |
          git config user.name "maj-auto"
          git config user.email "maj-auto@users.noreply.github.com"
          git add events.json geocache.json
          git diff --cached --quiet || git commit -m "Mise à jour des concours"
          git push
